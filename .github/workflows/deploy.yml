name: Deploy to GitHub Pages

# Publishes the PUBLIC build only (`npm run build`). Presenter mode
# (`npm run present`) is local and is never built here.
# One publishing branch, so a push to another branch can't overwrite the
# live site with an older build.
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      # Refuse to publish if private outreach data or a presenter-only
      # view made it into the bundle.
      - run: npm run check:public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
